<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="'Segoe UI',sans-serif">
  <rect width="1200" height="750" fill="#0f1117"/>
  <!-- sidebar -->
  <rect x="0" y="0" width="220" height="750" fill="#1a1d27"/>
  <text x="24" y="42" font-size="20" font-weight="800" fill="#e8eaf6">Kharcha<tspan fill="#6366f1">Pro</tspan></text>
  <g font-size="13.5" fill="#6b7280">
    <rect x="14" y="70" width="192" height="36" rx="10" fill="#6366f120"/>
    <text x="30" y="93" fill="#6366f1" font-weight="600">📊 Dashboard</text>
    <text x="30" y="139">📁 Folders</text>
    <text x="30" y="185">💳 Transactions</text>
    <text x="30" y="231">📈 Analytics</text>
    <text x="30" y="277">📄 Reports</text>
    <text x="30" y="323">⚙️ Settings</text>
  </g>
  <!-- topbar -->
  <text x="1160" y="42" font-size="18" text-anchor="end" fill="#6b7280">🌙</text>
  <!-- stat cards -->
  <g font-size="12">
    <g transform="translate(244,30)">
      <rect width="220" height="90" rx="12" fill="#1a1d27"/>
      <circle cx="30" cy="30" r="16" fill="#22c55e22"/>
      <text x="30" y="35" text-anchor="middle" font-size="14">💰</text>
      <text x="20" y="66" fill="#6b7280">Total Income</text>
      <text x="20" y="84" fill="#e8eaf6" font-size="17" font-weight="700">₹1,24,500</text>
    </g>
    <g transform="translate(484,30)">
      <rect width="220" height="90" rx="12" fill="#1a1d27"/>
      <circle cx="30" cy="30" r="16" fill="#ef444422"/>
      <text x="30" y="35" text-anchor="middle" font-size="14">💸</text>
      <text x="20" y="66" fill="#6b7280">Total Expenses</text>
      <text x="20" y="84" fill="#e8eaf6" font-size="17" font-weight="700">₹78,320</text>
    </g>
    <g transform="translate(724,30)">
      <rect width="220" height="90" rx="12" fill="#1a1d27"/>
      <circle cx="30" cy="30" r="16" fill="#3b82f622"/>
      <text x="30" y="35" text-anchor="middle" font-size="14">🏦</text>
      <text x="20" y="66" fill="#6b7280">Balance</text>
      <text x="20" y="84" fill="#3b82f6" font-size="17" font-weight="700">₹46,180</text>
    </g>
    <g transform="translate(964,30)">
      <rect width="220" height="90" rx="12" fill="#1a1d27"/>
      <circle cx="30" cy="30" r="16" fill="#8b5cf622"/>
      <text x="30" y="35" text-anchor="middle" font-size="14">📁</text>
      <text x="20" y="66" fill="#6b7280">Folders</text>
      <text x="20" y="84" fill="#e8eaf6" font-size="17" font-weight="700">5</text>
    </g>
  </g>
  <!-- recent transactions -->
  <g transform="translate(244,150)">
    <rect width="460" height="330" rx="12" fill="#1a1d27"/>
    <text x="20" y="32" fill="#e8eaf6" font-size="14" font-weight="700">Recent transactions</text>
    <g font-size="12" fill="#e8eaf6">
      <text x="20" y="66">Zomato order</text>
      <text x="440" y="66" text-anchor="end" fill="#ef4444">-₹340</text>
      <text x="20" y="64" dy="16" fill="#6b7280">Today · 🍱 Food</text>
      <line x1="20" y1="88" x2="440" y2="88" stroke="#2a2f45"/>
      <text x="20" y="112">Freelance payment</text>
      <text x="440" y="112" text-anchor="end" fill="#22c55e">+₹8,000</text>
      <text x="20" y="128" fill="#6b7280">Yesterday · 💰 Income</text>
      <line x1="20" y1="146" x2="440" y2="146" stroke="#2a2f45"/>
      <text x="20" y="170">Petrol refill</text>
      <text x="440" y="170" text-anchor="end" fill="#ef4444">-₹500</text>
      <text x="20" y="186" fill="#6b7280">2 days ago · ⛽ Petrol · 📁 Bike</text>
      <line x1="20" y1="204" x2="440" y2="204" stroke="#2a2f45"/>
      <text x="20" y="228">Recharge - Jio</text>
      <text x="440" y="228" text-anchor="end" fill="#ef4444">-₹249</text>
      <text x="20" y="244" fill="#6b7280">3 days ago · 📱 Recharge</text>
      <line x1="20" y1="262" x2="440" y2="262" stroke="#2a2f45"/>
      <text x="20" y="286">Goa trip advance</text>
      <text x="440" y="286" text-anchor="end" fill="#ef4444">-₹3,200</text>
      <text x="20" y="302" fill="#6b7280">5 days ago · ✈️ Travel · 📁 Goa Trip</text>
    </g>
  </g>
  <!-- spending by category donut -->
  <g transform="translate(724,150)">
    <rect width="220" height="330" rx="12" fill="#1a1d27"/>
    <text x="20" y="32" fill="#e8eaf6" font-size="14" font-weight="700">Spending by category</text>
    <g transform="translate(110,120)">
      <circle r="65" fill="none" stroke="#f59e0b" stroke-width="26" stroke-dasharray="120 288" transform="rotate(-90)"/>
      <circle r="65" fill="none" stroke="#ef4444" stroke-width="26" stroke-dasharray="80 288" stroke-dashoffset="-120" transform="rotate(-90)"/>
      <circle r="65" fill="none" stroke="#3b82f6" stroke-width="26" stroke-dasharray="60 288" stroke-dashoffset="-200" transform="rotate(-90)"/>
      <circle r="65" fill="none" stroke="#8b5cf6" stroke-width="26" stroke-dasharray="28 288" stroke-dashoffset="-260" transform="rotate(-90)"/>
    </g>
    <g font-size="11" fill="#e8eaf6">
      <circle cx="26" cy="240" r="4" fill="#f59e0b"/><text x="36" y="244">Food</text>
      <circle cx="26" cy="262" r="4" fill="#ef4444"/><text x="36" y="266">Petrol</text>
      <circle cx="120" cy="240" r="4" fill="#3b82f6"/><text x="130" y="244">Travel</text>
      <circle cx="120" cy="262" r="4" fill="#8b5cf6"/><text x="130" y="266">Electronics</text>
    </g>
  </g>
  <!-- folder progress -->
  <g transform="translate(964,150)">
    <rect width="220" height="330" rx="12" fill="#1a1d27"/>
    <text x="20" y="32" fill="#e8eaf6" font-size="14" font-weight="700">Folder progress</text>
    <g font-size="11">
      <text x="20" y="60" fill="#e8eaf6">📁 Goa Trip</text>
      <text x="200" y="60" text-anchor="end" fill="#f59e0b">₹3,200 spent</text>
      <rect x="20" y="68" width="180" height="6" rx="3" fill="#2a2f45"/>
      <rect x="20" y="68" width="130" height="6" rx="3" fill="#f59e0b"/>
      <text x="20" y="108" fill="#e8eaf6">📁 Bike</text>
      <text x="200" y="108" text-anchor="end" fill="#22c55e">₹500 left</text>
      <rect x="20" y="116" width="180" height="6" rx="3" fill="#2a2f45"/>
      <rect x="20" y="116" width="90" height="6" rx="3" fill="#6366f1"/>
      <text x="20" y="156" fill="#e8eaf6">📁 New Laptop</text>
      <text x="200" y="156" text-anchor="end" fill="#ef4444">Over ₹1,200</text>
      <rect x="20" y="164" width="180" height="6" rx="3" fill="#2a2f45"/>
      <rect x="20" y="164" width="180" height="6" rx="3" fill="#ef4444"/>
    </g>
  </g>
</svg>
