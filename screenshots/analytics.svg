<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="'Segoe UI',sans-serif">
  <rect width="1200" height="750" fill="#0f1117"/>
  <rect x="0" y="0" width="220" height="750" fill="#1a1d27"/>
  <text x="24" y="42" font-size="20" font-weight="800" fill="#e8eaf6">Kharcha<tspan fill="#6366f1">Pro</tspan></text>
  <g font-size="13.5" fill="#6b7280">
    <text x="30" y="93">📊 Dashboard</text>
    <text x="30" y="139">📁 Folders</text>
    <text x="30" y="185">💳 Transactions</text>
    <rect x="14" y="208" width="192" height="36" rx="10" fill="#6366f120"/>
    <text x="30" y="231" fill="#6366f1" font-weight="600">📈 Analytics</text>
    <text x="30" y="277">📄 Reports</text>
    <text x="30" y="323">⚙️ Settings</text>
  </g>
  <text x="244" y="52" fill="#e8eaf6" font-size="20" font-weight="700">Analytics</text>

  <!-- pie chart card -->
  <g transform="translate(244,90)">
    <rect width="410" height="330" rx="12" fill="#1a1d27"/>
    <text x="20" y="32" fill="#e8eaf6" font-size="14" font-weight="700">Spending by category</text>
    <g transform="translate(140,170)">
      <circle r="90" fill="none" stroke="#f59e0b" stroke-width="34" stroke-dasharray="150 396" transform="rotate(-90)"/>
      <circle r="90" fill="none" stroke="#ef4444" stroke-width="34" stroke-dasharray="95 396" stroke-dashoffset="-150" transform="rotate(-90)"/>
      <circle r="90" fill="none" stroke="#3b82f6" stroke-width="34" stroke-dasharray="75 396" stroke-dashoffset="-245" transform="rotate(-90)"/>
      <circle r="90" fill="none" stroke="#8b5cf6" stroke-width="34" stroke-dasharray="45 396" stroke-dashoffset="-320" transform="rotate(-90)"/>
      <circle r="90" fill="none" stroke="#14b8a6" stroke-width="34" stroke-dasharray="31 396" stroke-dashoffset="-365" transform="rotate(-90)"/>
    </g>
    <g font-size="11" fill="#e8eaf6">
      <circle cx="300" cy="120" r="4" fill="#f59e0b"/><text x="310" y="124">Food ₹18,400</text>
      <circle cx="300" cy="144" r="4" fill="#ef4444"/><text x="310" y="148">Petrol ₹11,600</text>
      <circle cx="300" cy="168" r="4" fill="#3b82f6"/><text x="310" y="172">Travel ₹9,200</text>
      <circle cx="300" cy="192" r="4" fill="#8b5cf6"/><text x="310" y="196">Electronics ₹5,500</text>
      <circle cx="300" cy="216" r="4" fill="#14b8a6"/><text x="310" y="220">Internet ₹3,800</text>
    </g>
  </g>

  <!-- bar chart card -->
  <g transform="translate(674,90)">
    <rect width="510" height="330" rx="12" fill="#1a1d27"/>
    <text x="20" y="32" fill="#e8eaf6" font-size="14" font-weight="700">Monthly income vs expenses</text>
    <g font-size="10" fill="#6b7280">
      <text x="70" y="290">Jan</text><text x="150" y="290">Feb</text><text x="230" y="290">Mar</text>
      <text x="310" y="290">Apr</text><text x="390" y="290">May</text><text x="470" y="290">Jun</text>
    </g>
    <g>
      <rect x="55" y="150" width="16" height="120" fill="#22c55e"/><rect x="73" y="190" width="16" height="80" fill="#ef4444"/>
      <rect x="135" y="120" width="16" height="150" fill="#22c55e"/><rect x="153" y="170" width="16" height="100" fill="#ef4444"/>
      <rect x="215" y="90" width="16" height="180" fill="#22c55e"/><rect x="233" y="200" width="16" height="70" fill="#ef4444"/>
      <rect x="295" y="160" width="16" height="110" fill="#22c55e"/><rect x="313" y="150" width="16" height="120" fill="#ef4444"/>
      <rect x="375" y="110" width="16" height="160" fill="#22c55e"/><rect x="393" y="180" width="16" height="90" fill="#ef4444"/>
      <rect x="455" y="100" width="16" height="170" fill="#22c55e"/><rect x="473" y="160" width="16" height="110" fill="#ef4444"/>
    </g>
    <line x1="40" y1="270" x2="500" y2="270" stroke="#2a2f45"/>
    <g font-size="11" fill="#e8eaf6">
      <rect x="330" y="46" width="10" height="10" fill="#22c55e"/><text x="345" y="55">Income</text>
      <rect x="410" y="46" width="10" height="10" fill="#ef4444"/><text x="425" y="55">Expense</text>
    </g>
  </g>

  <!-- category table -->
  <g transform="translate(244,438)">
    <rect width="940" height="180" rx="12" fill="#1a1d27"/>
    <text x="20" y="32" fill="#e8eaf6" font-size="14" font-weight="700">Category vs budget</text>
    <g font-size="11" fill="#6b7280">
      <text x="20" y="58">Category</text><text x="300" y="58">Budget</text><text x="500" y="58">Spent</text><text x="700" y="58">Status</text>
    </g>
    <line x1="20" y1="68" x2="920" y2="68" stroke="#2a2f45"/>
    <g font-size="12" fill="#e8eaf6">
      <text x="20" y="92">🍱 Food</text><text x="300" y="92">₹15,000</text><text x="500" y="92" fill="#ef4444">₹18,400</text>
      <text x="700" y="92" fill="#ef4444">Over ₹3,400</text>
      <text x="20" y="122">⛽ Petrol</text><text x="300" y="122">₹12,000</text><text x="500" y="122" fill="#22c55e">₹11,600</text>
      <text x="700" y="122" fill="#22c55e">₹400 left</text>
      <text x="20" y="152">✈️ Travel</text><text x="300" y="152">₹10,000</text><text x="500" y="152" fill="#22c55e">₹9,200</text>
      <text x="700" y="152" fill="#22c55e">₹800 left</text>
    </g>
  </g>
</svg>
